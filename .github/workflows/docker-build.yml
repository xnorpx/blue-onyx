name: Build and Publish Docker Image

on:
  workflow_run:
    workflows: ["release"]
    types:
      - completed

permissions:
  contents: read      # Read the repository code
  packages: write     # Push to GitHub Container Registry

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921 # master
        with:
          toolchain: stable

      - name: Build blue_onyx binaries
        run: |
          cargo build --release --bin blue_onyx

      - name: Prepare Docker context
        run: |
          mkdir docker-context
          cp ./target/release/blue_onyx docker-context/
          cp ./target/release/libonnxruntime.so docker-context/
          cp -r /tmp/models docker-context/models
          cp ./Dockerfile docker-context/

      - name: Get blue_onyx version
        id: get_version
        run: |
          VERSION=$(./target/release/blue_onyx --version | awk '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4.2.1
        with:
          context: docker-context
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/blue_onyx:latest
            ghcr.io/${{ github.repository_owner }}/blue_onyx:${{ env.VERSION }}

  build-cuda:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get blue_onyx version
        run: |
          VERSION=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CUDA image
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4.2.1
        with:
          context: .
          file: Dockerfile.cuda
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/blue_onyx:latest-cuda
            ghcr.io/${{ github.repository_owner }}/blue_onyx:${{ env.VERSION }}-cuda
          cache-from: type=gha,scope=cuda
          cache-to: type=gha,mode=max,scope=cuda
